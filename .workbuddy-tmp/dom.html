  z-index: 300;
  background: rgba(5, 7, 9, 0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  animation: lbFade 0.25s ease;
}

@keyframes lbFade { from { opacity: 0; } }

.lightbox__panel {
  position: relative;
  width: min(1280px, 100%);
  max-height: calc(100vh - 80px);
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 32px 36px 30px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: lbRise 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes lbRise {
  from { opacity: 0; transform: translateY(24px) scale(0.98); }
}

.lightbox__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}

.lightbox__head-info {
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}

.lightbox__tag {
  font-size: 12px;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  background: var(--accent-dim);
  padding: 3px 12px;
  border-radius: 999px;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.lightbox__head h3 { font-size: 22px; letter-spacing: 0.02em; }

.lightbox__year {
  font-family: var(--font-en);
  font-size: 12px;
  color: var(--text-faint);
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.lightbox__close {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--text-dim);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
}

.lightbox__close:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: rotate(90deg);
}

.lightbox__desc {
  margin-top: 14px;
  color: var(--text-dim);
  font-size: 14px;
  max-width: 880px;
}

.lightbox__stage {
  position: relative;
  margin-top: 24px;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.lightbox__img {
  max-width: 100%;
  max-height: calc(100vh - 380px);
  min-height: 320px;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid var(--line);
  animation: lbImg 0.3s ease;
}

@keyframes lbImg { from { opacity: 0; transform: scale(0.99); } }

.lightbox__caption {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 16px;
}

.lightbox__count {
  font-family: var(--font-en);
  color: var(--accent);
  letter-spacing: 0.15em;
}

.lightbox__nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: rgba(10, 12, 16, 0.6);
  backdrop-filter: blur(8px);
  color: var(--text);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox__nav:hover { border-color: var(--accent); color: var(--accent); }
.lightbox__nav--prev { left: -8px; }
.lightbox__nav--next { right: -8px; }

.lightbox__thumbs {
  margin-top: 22px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 12px;
  overflow-x: auto;
}

.lightbox__thumb {
  flex-shrink: 0;
  width: 108px;
  height: 68px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  padding: 0;
  background: none;
  cursor: pointer;
  opacity: 0.45;
  transition: all 0.25s;
}

.lightbox__thumb img { width: 100%; height: 100%; object-fit: cover; }

.lightbox__thumb:hover { opacity: 0.85; }

.lightbox__thumb.is-active {
  opacity: 1;
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

/* ---------- Strengths ---------- */
.strengths__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-top: 48px;
}

.scard {
  position: relative;
  padding: 40px 36px 36px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
  transition: transform 0.3s, border-color 0.3s;
}

.scard::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
}

.scard:hover { transform: translateY(-6px); border-color: var(--line-strong); }
.scard:hover::before { opacity: 1; }

.scard__no {
  font-family: var(--font-en);
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.2em;
}

.scard h3 {
  font-size: 20px;
  margin: 18px 0 14px;
  letter-spacing: 0.02em;
}

.scard p {
  color: var(--text-dim);
  font-size: 14.5px;
  min-height: 74px;
}

.scard__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}

.scard__tags span {
  font-size: 12px;
  color: var(--text-faint);
  border: 1px solid var(--line);
  padding: 4px 12px;
  border-radius: 999px;
  letter-spacing: 0.05em;
  transition: all 0.2s;
}

.scard:hover .scard__tags span { border-color: rgba(79, 227, 193, 0.35); color: var(--text-dim); }

/* ---------- AI Workflow ---------- */
.ai {
  background: var(--bg-soft);
  border-top: 1px solid var(--line);
}

.ai__head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 60px;
  flex-wrap: wrap;
}

.ai__lead {
  color: var(--text-dim);
  margin-top: 8px;
}

.ai__tools {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 560px;
  justify-content: flex-end;
}

.ai__tools span {
  font-family: var(--font-en);
  font-size: 13px;
  color: var(--text-dim);
  border: 1px solid var(--line-strong);
  padding: 8px 18px;
  border-radius: 999px;
  letter-spacing: 0.06em;
  transition: all 0.25s;
}

.ai__tools span:hover {
  color: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(79, 227, 193, 0.15);
}

.ai__grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 28px;
  margin-top: 72px;
}

.ai__card {
  padding: 34px 30px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  transition: transform 0.3s, border-color 0.3s;
}

.ai__card:hover { transform: translateY(-6px); border-color: var(--line-strong); }

.ai__step {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}

.ai__step span {
  font-family: var(--font-en);
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--accent);
}

.ai__step i {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--accent-dim), transparent);
}

.ai__step i.last { background: linear-gradient(90deg, var(--accent), transparent); }

.ai__card h3 { font-size: 18px; margin-bottom: 10px; }
.ai__card p { color: var(--text-dim); font-size: 14px; }

/* ---------- Contact Footer ---------- */
.contact {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  overflow: hidden;
  border-top: 1px solid var(--line);
}

.contact__glow {
  position: absolute;
  left: 50%;
  bottom: -30%;
  transform: translateX(-50%);
  width: 1200px;
  height: 600px;
  background: radial-gradient(ellipse at center, rgba(79, 227, 193, 0.09), transparent 65%);
  pointer-events: none;
}

.contact__inner {
  position: relative;
  z-index: 2;
  width: 100%;
  padding-top: 80px;
  padding-bottom: 40px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  justify-content: center;
}

.contact__kicker {
  font-family: var(--font-en);
  font-size: 12px;
  letter-spacing: 0.35em;
  color: var(--accent);
  margin-bottom: 26px;
}

.contact__title {
  font-size: clamp(56px, 6.4vw, 118px);
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: 0.01em;
}

.contact__sub {
  margin-top: 30px;
  color: var(--text-dim);
  font-size: 17px;
}

.contact__list {
  margin-top: 64px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line);
}

.contact__item {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 36px 32px 36px 0;
  border-bottom: 1px solid var(--line);
  transition: all 0.25s;
}

.contact__item:not(:last-child) { border-right: 1px solid var(--line); padding-right: 48px; }
.contact__item + .contact__item { padding-left: 48px; }

.contact__item:hover { background: rgba(255, 255, 255, 0.015); }

.contact__label {
  font-family: var(--font-en);
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--text-faint);
}

.contact__value {
  font-size: clamp(18px, 1.5vw, 26px);
  font-weight: 600;
  letter-spacing: 0.02em;
}

a.contact__item:hover .contact__value { color: var(--accent); }

.footer {
  margin-top: auto;
  padding-top: 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-faint);
  letter-spacing: 0.06em;
}

.footer__back {
  cursor: pointer;
  transition: color 0.2s;
}

.footer__back:hover { color: var(--accent); }

/* ---------- 响应式（基础适配，后续按需细化） ---------- */
@media (max-width: 1280px) {
  .container { padding: 0 48px; }
  .about__grid { grid-template-columns: 380px 1fr; gap: 60px; }
  .projects__grid { grid-template-columns: repeat(2, 1fr); }
  .strengths__grid { grid-template-columns: repeat(2, 1fr); }
  .ai__grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 900px) {
  .nav__links { display: none; }
  .hero__title { flex-direction: column; gap: 12px; }
  .about__grid, .projects__grid, .strengths__grid, .ai__grid,
  .contact__list, .about__stats, .about__contact { grid-template-columns: 1fr; }
  .timeline__item { grid-template-columns: 1fr; gap: 12px; }
  .contact__item { border-right: none !important; padding-left: 0 !important; padding-right: 0 !important; }
  .section { padding: 90px 0; }
}
